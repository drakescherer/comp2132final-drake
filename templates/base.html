<!DOCTYPE html>
<html lang="en">
<head>
    <title>Err0rdev | Engineering, Projects & YouTube</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, width=device-width">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" type="image/png"
      href="{{ url_for('static', filename='img/favicon/favicon-32x32.png') }}"
      sizes="32x32">

      href="{{ url_for('static', filename='img/favicon/favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180"
      href="{{ url_for('static', filename='img/favicon/apple-touch-icon.png') }}">
    <meta name="color-scheme" content="dark">
    <script src="https://kit.fontawesome.com/c3a7a182b6.js" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/project-objects.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/project-functions.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/project.js') }}" defer></script>
</head>
<body>
<header class="header-content">
    <div class="header-inner">
        <a href="{{ url_for('home') }}" class="icons"><i class="fa-solid fa-house"></i></a>
        <img src="{{ url_for('static', filename='img/devlogomini.png') }}" alt="Dev Logo" class="logo">
        <a href="{{ url_for('home') }}" class="icons"><i class="fa-solid fa-bars"></i></a>
    </div>
</header>
{% block content %}
{% endblock %}
</body>
</html>
